name: Release local app

# Push a tag like v0.1.0 (same as psmm/__init__.py) to publish the local app
# executables on the GitHub Releases page.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Tests
        run: |
          pip install mymcplusplus==3.2.0 pytest
          pytest -q
          (cd launcher && go vet ./... && go test ./...)
      - name: Check the tag matches the version
        run: |
          v=$(python -c "import psmm; print(psmm.__version__)")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version v$v"; exit 1; }
      - uses: actions/cache@v4
        with:
          path: .cache
          key: pyodide-${{ hashFiles('tools/fetch_pyodide.py') }}
      - name: Build
        run: python tools/build_local.py --target linux-x86_64 --target linux-arm64 --archive
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          **Local app (Linux)** — the same PSMemoryManager as the website, in one file that needs nothing installed and works without internet.

          1. Download the file for your computer: `linux-x86_64` (most PCs) or `linux-arm64` (Raspberry Pi and other ARM boards).
          2. Extract it and double-click **PSMemoryManager** (or run `./PSMemoryManager` in a terminal). Your browser opens with the app.
          3. It closes by itself shortly after you close its browser tab.

          ---

          **Aplicativo local (Linux)** — o mesmo PSMemoryManager do site, em um arquivo só, sem instalar nada e sem precisar de internet.

          1. Baixe o arquivo do seu computador: `linux-x86_64` (a maioria dos PCs) ou `linux-arm64` (Raspberry Pi e outras placas ARM).
          2. Extraia e dê dois cliques em **PSMemoryManager** (ou rode `./PSMemoryManager` no terminal). O navegador abre com o aplicativo.
          3. Ele fecha sozinho logo depois que você fecha a aba do navegador.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --title "PSMemoryManager $GITHUB_REF_NAME" --notes-file notes.md
